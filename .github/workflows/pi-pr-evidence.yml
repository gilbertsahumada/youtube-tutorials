name: Pi PR evidence review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "videos/pi-pr-evidence/**"

# Serialize runs for one PR so two synchronize events cannot publish duplicate
# comments. Different Pull Requests continue independently.
concurrency:
  group: pi-pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The workflow publishes one advisory comment and never writes to the repository.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # This first version intentionally uses API-key auth. Subscription OAuth
    # is documented for local interactive runs; it is not logged into here.
    # The API key is never exposed to fork Pull Requests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PI_MODEL: ${{ vars.PI_MODEL }}
      # Optional. Set this only when PI_MODEL points to a custom
      # OpenAI-compatible endpoint. Leave it empty for Pi's built-in providers.
      PI_BASE_URL: ${{ vars.PI_BASE_URL }}
    defaults:
      run:
        working-directory: videos/pi-pr-evidence

    steps:
      - name: Checkout Pull Request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Pi only needs the local checkout; do not leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated paths and trusted review policy
        id: prepare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          PI_RUNTIME_PATH="$RUNNER_TEMP/pi-runtime"
          PI_CONFIG_PATH="$PI_RUNTIME_PATH/pi-config"
          REVIEW_DIR_PATH="$RUNNER_TEMP/pi-pr-evidence"
          SKILL_PATH="$PI_RUNTIME_PATH/pr-evidence/SKILL.md"

          echo "PI_RUNTIME=$PI_RUNTIME_PATH" >> "$GITHUB_ENV"
          echo "PI_CODING_AGENT_DIR=$PI_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "REVIEW_DIR=$REVIEW_DIR_PATH" >> "$GITHUB_ENV"
          echo "PI_REVIEW_PATH=$REVIEW_DIR_PATH/report.md" >> "$GITHUB_ENV"

          rm -rf "$PI_RUNTIME_PATH" "$REVIEW_DIR_PATH"
          mkdir -p "$PI_RUNTIME_PATH/pr-evidence" "$PI_CONFIG_PATH" "$REVIEW_DIR_PATH"

          if ! git cat-file -e "$BASE_SHA:videos/pi-pr-evidence/.pi/skills/pr-evidence/SKILL.md"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=the base revision does not contain the pr-evidence skill; manual review is required" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BASE_SHA:videos/pi-pr-evidence/.pi/package.json"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=the base revision does not contain the Pi package manifest; manual review is required" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BASE_SHA:videos/pi-pr-evidence/.pi/package-lock.json"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=the base revision does not contain the Pi lockfile; manual review is required" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Policy and runtime inputs come from the trusted base revision, not
          # from files that the Pull Request can change.
          git show "$BASE_SHA:videos/pi-pr-evidence/.pi/package.json" > "$PI_RUNTIME_PATH/package.json"
          git show "$BASE_SHA:videos/pi-pr-evidence/.pi/package-lock.json" > "$PI_RUNTIME_PATH/package-lock.json"
          git show "$BASE_SHA:videos/pi-pr-evidence/.pi/skills/pr-evidence/SKILL.md" > "$SKILL_PATH"

          npm ci --prefix "$PI_RUNTIME_PATH" --ignore-scripts --no-audit --no-fund

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "skill_path=$SKILL_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate Pi configuration
        id: config
        if: steps.prepare.outputs.ready == 'true'
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
        run: |
          if [[ -z "${PI_MODEL:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "reason=define the PI_MODEL repository variable as provider/model-id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$PI_API_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "reason=define the PI_API_KEY repository secret for the selected provider" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PI_MODEL" != */* ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "reason=PI_MODEL must use the provider/model-id format" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          provider="${PI_MODEL%%/*}"
          model_id="${PI_MODEL#*/}"
          if [[ -z "$provider" || -z "$model_id" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "reason=PI_MODEL must include both a provider and a model id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "${PI_BASE_URL:-}" && "$PI_BASE_URL" != https://* ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "reason=PI_BASE_URL must use HTTPS when configuring a custom provider" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "model_id=$model_id" >> "$GITHUB_OUTPUT"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure custom OpenAI-compatible provider
        id: provider
        if: steps.prepare.outputs.ready == 'true' && steps.config.outputs.configured == 'true'
        env:
          PI_PROVIDER: ${{ steps.config.outputs.provider }}
          PI_MODEL_ID: ${{ steps.config.outputs.model_id }}
        run: |
          set -euo pipefail

          # An empty PI_BASE_URL means that Pi should resolve the provider
          # from its built-in catalog. Otherwise register the arbitrary
          # OpenAI-compatible endpoint without putting the API key on disk.
          if [[ -z "${PI_BASE_URL:-}" ]]; then
            echo "mode=builtin" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PI_MODEL="$PI_MODEL" \
          PI_PROVIDER="$PI_PROVIDER" \
          PI_MODEL_ID="$PI_MODEL_ID" \
          PI_BASE_URL="$PI_BASE_URL" \
          python3 - "$PI_CODING_AGENT_DIR/models.json" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]
          config = {
              "providers": {
                  os.environ["PI_PROVIDER"]: {
                      "baseUrl": os.environ["PI_BASE_URL"].rstrip("/"),
                      "api": "openai-completions",
                      "models": [
                          {
                              "id": os.environ["PI_MODEL_ID"],
                              "name": os.environ["PI_MODEL"],
                              "input": ["text"],
                          }
                      ],
                  }
              }
          }
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(config, stream, indent=2)
              stream.write("\n")
          PY

          echo "mode=openai-compatible" >> "$GITHUB_OUTPUT"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Capture Pull Request diff
        if: steps.prepare.outputs.ready == 'true' && steps.config.outputs.configured == 'true' && steps.provider.outputs.configured == 'true'
        run: |
          git diff --no-ext-diff --unified=80 \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- . > "$REVIEW_DIR/pr.diff"

      - name: Run Pi in read-only mode
        if: steps.prepare.outputs.ready == 'true' && steps.config.outputs.configured == 'true' && steps.provider.outputs.configured == 'true'
        env:
          # Keep the provider credential out of checkout and bootstrap steps.
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
        run: |
          "$PI_RUNTIME/node_modules/.bin/pi" \
            --print \
            --no-session \
            --no-extensions \
            --no-skills \
            --no-context-files \
            --skill "${{ steps.prepare.outputs.skill_path }}" \
            --tools read,grep,find,ls \
            --model "$PI_MODEL" \
            --api-key "$PI_API_KEY" \
            --thinking low \
            "Usa la skill pr-evidence. Revisa este Pull Request en modo read-only. El diff está en $REVIEW_DIR/pr.diff. Lee primero ese archivo y genera únicamente el reporte Markdown definido por la skill." \
            > "$PI_REVIEW_PATH"

      - name: Publish or update the Pull Request comment
        if: steps.prepare.outputs.ready == 'true' && steps.config.outputs.configured == 'true' && steps.provider.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const marker = "<!-- pi-pr-evidence -->";
            const reportPath = process.env.PI_REVIEW_PATH;
            if (!reportPath) {
              throw new Error("PI_REVIEW_PATH was not initialized");
            }

            let report = fs.readFileSync(reportPath, "utf8").trim();

            // Keep the comment below GitHub's size limit if a model ignores the
            // requested concise format.
            if (report.length > 60000) {
              report = `${report.slice(0, 59500)}\n\n_Report truncated by the workflow._`;
            }

            const body = [
              marker,
              report,
              "",
              "<sub>Pi PR evidence review · advisory · read-only</sub>",
            ].join("\n");

            const issueNumber = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );

            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

      - name: Explain skipped configuration
        if: steps.prepare.outputs.ready == 'true' && steps.config.outputs.configured != 'true'
        run: |
          {
            echo "## Pi PR evidence review"
            echo
            echo "Automated review skipped; manual review is required."
            echo
            echo "**Reason:** ${{ steps.config.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain skipped bootstrap review
        if: steps.prepare.outputs.ready != 'true'
        run: |
          {
            echo "## Pi PR evidence review"
            echo
            echo "Automated review skipped; manual review is required."
            echo
            echo "**Reason:** ${{ steps.prepare.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runtime files
        if: always()
        run: rm -rf "$RUNNER_TEMP/pi-pr-evidence" "$RUNNER_TEMP/pi-runtime"
