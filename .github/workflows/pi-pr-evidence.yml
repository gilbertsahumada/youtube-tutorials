name: Pi PR evidence review

on:
  # Run only for Pull Requests whose target branch is main.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "videos/pi-pr-evidence/**"

# If the PR changes again while a review is running, keep only the newest run.
concurrency:
  group: pi-pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Pi only reads the repository. The separate github-script step publishes one
# advisory comment using GITHUB_TOKEN.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Do not expose the provider key to Pull Requests coming from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Required: provider/model-id, for example dashscope/deepseek-v4.1-flash.
      PI_MODEL: ${{ vars.PI_MODEL }}
      # Optional: only for a custom OpenAI-compatible endpoint.
      PI_BASE_URL: ${{ vars.PI_BASE_URL }}
    defaults:
      run:
        working-directory: videos/pi-pr-evidence

    steps:
      # 1. Check out the PR so Git can calculate the diff.
      - name: 1. Checkout Pull Request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Do not leave GITHUB_TOKEN in .git/config for Pi to read.
          persist-credentials: false

      # 2. Install Node because Pi is a Node CLI.
      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install Pi and copy the review policy from the trusted base commit.
      #    The PR cannot replace the package, lockfile, or skill used here.
      - name: 3. Prepare Pi runtime and trusted skill
        id: prepare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          PI_RUNTIME_PATH="$RUNNER_TEMP/pi-runtime"
          PI_CONFIG_PATH="$PI_RUNTIME_PATH/pi-config"
          REVIEW_DIR_PATH="$RUNNER_TEMP/pi-pr-evidence"
          SKILL_PATH="$PI_RUNTIME_PATH/pr-evidence/SKILL.md"

          # Make these paths available to later steps without putting files
          # inside the PR checkout.
          echo "PI_RUNTIME=$PI_RUNTIME_PATH" >> "$GITHUB_ENV"
          echo "PI_CODING_AGENT_DIR=$PI_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "REVIEW_DIR=$REVIEW_DIR_PATH" >> "$GITHUB_ENV"
          echo "PI_REVIEW_PATH=$REVIEW_DIR_PATH/report.md" >> "$GITHUB_ENV"

          rm -rf "$PI_RUNTIME_PATH" "$REVIEW_DIR_PATH"
          mkdir -p "$PI_RUNTIME_PATH/pr-evidence" "$PI_CONFIG_PATH" "$REVIEW_DIR_PATH"

          # These files must already exist in the base revision. If this is the
          # first PR that introduces the demo, skip until the demo is merged.
          if ! git cat-file -e "$BASE_SHA:videos/pi-pr-evidence/.pi/package.json" || \
             ! git cat-file -e "$BASE_SHA:videos/pi-pr-evidence/.pi/package-lock.json" || \
             ! git cat-file -e "$BASE_SHA:videos/pi-pr-evidence/.pi/skills/pr-evidence/SKILL.md"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=the base revision does not contain the trusted Pi runtime and skill; manual review is required" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git show "$BASE_SHA:videos/pi-pr-evidence/.pi/package.json" > "$PI_RUNTIME_PATH/package.json"
          git show "$BASE_SHA:videos/pi-pr-evidence/.pi/package-lock.json" > "$PI_RUNTIME_PATH/package-lock.json"
          git show "$BASE_SHA:videos/pi-pr-evidence/.pi/skills/pr-evidence/SKILL.md" > "$SKILL_PATH"

          npm ci --prefix "$PI_RUNTIME_PATH" --ignore-scripts --no-audit --no-fund

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "skill_path=$SKILL_PATH" >> "$GITHUB_OUTPUT"

      # 4. Check the variables and, when needed, register a custom endpoint.
      #    This step does not write the API key to models.json.
      - name: 4. Validate configuration
        id: config
        if: steps.prepare.outputs.ready == 'true'
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
        run: |
          if [[ -z "${PI_MODEL:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "reason=define the PI_MODEL repository variable as provider/model-id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$PI_API_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "reason=define the PI_API_KEY repository secret for the selected provider" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PI_MODEL" != */* ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "reason=PI_MODEL must use the provider/model-id format" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          provider="${PI_MODEL%%/*}"
          model_id="${PI_MODEL#*/}"
          if [[ -z "$provider" || -z "$model_id" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "reason=PI_MODEL must include both a provider and a model id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "${PI_BASE_URL:-}" && "$PI_BASE_URL" != https://* ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "reason=PI_BASE_URL must use HTTPS when configuring a custom provider" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No URL means Pi uses one of its built-in providers. A URL means
          # this workflow creates the temporary models.json that Pi can read.
          if [[ -n "${PI_BASE_URL:-}" ]]; then
            PI_MODEL="$PI_MODEL" \
            PI_PROVIDER="$provider" \
            PI_MODEL_ID="$model_id" \
            PI_BASE_URL="$PI_BASE_URL" \
            python3 - "$PI_CODING_AGENT_DIR/models.json" <<'PY'
          import json
          import os
          import sys

          config = {
              "providers": {
                  os.environ["PI_PROVIDER"]: {
                      "baseUrl": os.environ["PI_BASE_URL"].rstrip("/"),
                      "api": "openai-completions",
                      "models": [
                          {
                              "id": os.environ["PI_MODEL_ID"],
                              "name": os.environ["PI_MODEL"],
                              "input": ["text"],
                          }
                      ],
                  }
              }
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(config, stream, indent=2)
              stream.write("\n")
          PY
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      # 5. Create the diff and make the one real Pi call.
      - name: 5. Ask Pi to review the diff
        if: steps.prepare.outputs.ready == 'true' && steps.config.outputs.configured == 'true'
        env:
          # The key exists only in this step and is never written to disk.
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
        run: |
          set -euo pipefail

          # Pi reads this file with its read tool; it does not need GitHub write access.
          git diff --no-ext-diff --unified=80 \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- . > "$REVIEW_DIR/pr.diff"

          # --no-skills means: do not discover skills from the PR automatically.
          # --skill means: load this one skill copied from the trusted base commit.
          # The explicit skill is therefore allowed while automatic discovery is off.
          "$PI_RUNTIME/node_modules/.bin/pi" \
            --print \
            --no-session \
            --no-extensions \
            --no-skills \
            --no-context-files \
            --skill "${{ steps.prepare.outputs.skill_path }}" \
            --tools read,grep,find,ls \
            --model "$PI_MODEL" \
            --api-key "$PI_API_KEY" \
            --thinking low \
            "Usa la skill pr-evidence. Revisa este Pull Request en modo read-only. El diff está en $REVIEW_DIR/pr.diff. Lee primero ese archivo y genera únicamente el reporte Markdown definido por la skill." \
            > "$PI_REVIEW_PATH"

      # 6. Pi only writes the report. This deterministic step writes the GitHub comment.
      - name: 6. Publish or update the advisory comment
        if: steps.prepare.outputs.ready == 'true' && steps.config.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const marker = "<!-- pi-pr-evidence -->";
            let report = fs.readFileSync(process.env.PI_REVIEW_PATH, "utf8").trim();

            if (report.length > 60000) {
              report = `${report.slice(0, 59500)}\n\n_Report truncated by the workflow._`;
            }

            const body = [
              marker,
              report,
              "",
              "<sub>Pi PR evidence review · advisory · read-only</sub>",
            ].join("\n");

            const issueNumber = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );

            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

      # Missing configuration is advisory: explain it without making CI red.
      - name: Explain skipped review
        if: always() && (steps.prepare.outputs.ready != 'true' || steps.config.outputs.configured != 'true')
        env:
          PREPARE_REASON: ${{ steps.prepare.outputs.reason }}
          CONFIG_REASON: ${{ steps.config.outputs.reason }}
        run: |
          reason="${CONFIG_REASON:-$PREPARE_REASON}"
          {
            echo "## Pi PR evidence review"
            echo
            echo "Automated review skipped; manual review is required."
            echo
            echo "**Reason:** $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      # Delete the temporary runtime, configuration, diff, and report.
      - name: Remove temporary files
        if: always()
        run: rm -rf "$RUNNER_TEMP/pi-pr-evidence" "$RUNNER_TEMP/pi-runtime"
