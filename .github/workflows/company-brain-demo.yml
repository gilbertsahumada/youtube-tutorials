name: Company Brain mail-to-issue tests

on:
  pull_request:
    paths:
      - "videos/company-brain/**"
      - ".github/workflows/company-brain-demo.yml"
  push:
    branches: [main]
    paths:
      - "videos/company-brain/**"
      - ".github/workflows/company-brain-demo.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: videos/company-brain/demo/package-lock.json
      - run: npm ci
        working-directory: videos/company-brain/demo
      - run: npx playwright install --with-deps chromium
        working-directory: videos/company-brain/demo
      - run: npm run check
        working-directory: videos/company-brain/demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: company-brain-browser-failures
          path: videos/company-brain/demo/output/playwright/
          if-no-files-found: ignore
          retention-days: 7
